<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--accent:#e94560;--accent2:#f5a623;--green:#00d4aa;--text:#eaeaea;--text-dim:#8888aa;--border:rgba(255,255,255,0.08);--radius:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#loadingScreen{display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:16px;}
.spinner{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#authScreen{display:none;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px;position:relative;overflow:hidden;}
#authScreen::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(233,69,96,0.15) 0%,transparent 70%);top:-200px;left:-200px;pointer-events:none;}
#authScreen::after{content:'';position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(0,212,170,0.1) 0%,transparent 70%);bottom:-150px;right:-150px;pointer-events:none;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:440px;position:relative;z-index:1;box-shadow:0 40px 80px rgba(0,0,0,0.5);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo .icon{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;background:linear-gradient(135deg,var(--accent),#ff6b6b);border-radius:18px;font-size:1.8em;margin-bottom:12px;box-shadow:0 8px 24px rgba(233,69,96,0.4);}
.auth-logo h1{font-size:1.6em;font-weight:800;letter-spacing:-0.5px;}
.auth-logo p{color:var(--text-dim);font-size:0.85em;margin-top:4px;}
.auth-tabs{display:flex;margin-bottom:24px;background:var(--surface2);border-radius:10px;padding:4px;gap:4px;}
.auth-tab{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:0.9em;font-weight:600;transition:all 0.2s;color:var(--text-dim);}
.auth-tab.active{background:var(--accent);color:white;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:0.75em;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.auth-field input{width:100%;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Sora',sans-serif;font-size:0.95em;transition:all 0.2s;}
.auth-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,69,96,0.15);}
.btn-auth{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#ff6b6b);color:white;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:1em;font-weight:700;cursor:pointer;margin-top:6px;transition:all 0.3s;}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(233,69,96,0.4);}
.btn-auth.green{background:linear-gradient(135deg,var(--green),#00a884);color:#001a14;}
.auth-msg{font-size:0.85em;text-align:center;margin-top:12px;min-height:20px;}
.auth-msg.error{color:var(--accent);}
.auth-msg.success{color:var(--green);}
#appScreen{display:none;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;}
.topbar-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.1em;}
.dot{width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.topbar-right{display:flex;align-items:center;gap:12px;}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 14px 6px 8px;}
.user-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8em;color:white;}
.av-super{background:linear-gradient(135deg,#e94560,#c0392b);}
.av-admin{background:linear-gradient(135deg,var(--accent2),#e67e22);}
.av-trainer{background:linear-gradient(135deg,var(--green),#00a884);}
.user-info-name{font-weight:600;font-size:0.85em;}
.user-info-role{font-size:0.7em;color:var(--text-dim);}
.btn-out{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:0.85em;font-family:'Sora',sans-serif;transition:all 0.2s;}
.btn-out:hover{border-color:var(--accent);color:var(--accent);}
.app-body{padding:24px;max-width:1400px;margin:0 auto;}
.clubs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.club-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all 0.2s;}
.club-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.club-card.active{border-color:var(--accent);background:rgba(233,69,96,0.08);}
.club-card-name{font-weight:700;font-size:1.1em;margin-bottom:8px;}
.club-card-stats{color:var(--text-dim);font-size:0.8em;display:flex;gap:16px;margin-top:8px;}
.club-card-stats span{color:var(--text);font-weight:600;}
.section-title{font-size:1.1em;font-weight:700;color:var(--accent2);margin-bottom:16px;}
.admin-panel{background:var(--surface);border:1px solid rgba(245,166,35,0.3);border-radius:var(--radius);padding:24px;margin-bottom:24px;}
.admin-panel h2{font-size:1em;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:20px;}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.admin-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px;}
.admin-box h3{font-size:0.85em;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;}
.field-group{margin-bottom:12px;}
.field-group label{display:block;font-size:0.75em;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;}
.field-group input{width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sora',sans-serif;font-size:0.9em;transition:all 0.2s;}
.field-group input:focus{outline:none;border-color:var(--accent2);}
#addTrainerMsg{font-size:0.8em;min-height:18px;margin-bottom:8px;}
.btn-add{width:100%;padding:11px;background:linear-gradient(135deg,var(--accent2),#e67e22);color:#1a1a00;border:none;border-radius:8px;font-family:'Sora',sans-serif;font-weight:700;font-size:0.9em;cursor:pointer;transition:all 0.2s;}
.btn-add:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(245,166,35,0.4);}
.trainer-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;}
.trainer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:0.85em;}
.t-name{font-weight:600;}.t-sub{color:var(--text-dim);font-size:0.8em;}
.btn-del-t{background:rgba(233,69,96,0.15);color:var(--accent);border:1px solid rgba(233,69,96,0.3);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:0.8em;font-family:'Sora',sans-serif;transition:all 0.2s;}
.btn-del-t:hover{background:rgba(233,69,96,0.3);}
.view-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.view-bar label{font-size:0.8em;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.view-bar select{padding:9px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sora',sans-serif;font-size:0.9em;cursor:pointer;}
.view-bar select option{background:var(--surface2);}
.v-badge{background:rgba(0,212,170,0.15);color:var(--green);border:1px solid rgba(0,212,170,0.3);border-radius:100px;padding:5px 14px;font-size:0.8em;font-weight:600;display:none;}
.month-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px;}
.month-nav h2{font-size:1.6em;font-weight:800;min-width:260px;text-align:center;}
.btn-m{background:var(--surface);border:1px solid var(--border);color:var(--text);width:42px;height:42px;border-radius:10px;font-size:1.1em;cursor:pointer;transition:all 0.2s;font-family:'Sora',sans-serif;}
.btn-m:hover{border-color:var(--accent);color:var(--accent);}
.controls-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.controls-bar input[type="text"]{flex:1;min-width:180px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sora',sans-serif;font-size:0.9em;}
.controls-bar input[type="text"]:focus{outline:none;border-color:var(--accent);}
.controls-bar select{padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Sora',sans-serif;font-size:0.9em;cursor:pointer;}
.controls-bar select option{background:var(--surface2);}
.btn-a{padding:10px 18px;border:none;border-radius:8px;font-family:'Sora',sans-serif;font-size:0.9em;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-red{background:linear-gradient(135deg,var(--accent),#ff6b6b);color:white;}
.btn-red:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(233,69,96,0.4);}
.btn-ol{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.btn-ol:hover{border-color:var(--text);color:var(--text);}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;}
.stat-card .val{font-size:2.2em;font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:6px;}
.stat-card .lbl{font-size:0.7em;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);}
.s-red .val{color:var(--accent);}.s-green .val{color:var(--green);}.s-yellow .val{color:var(--accent2);}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto;margin-bottom:20px;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--surface2);}
th{padding:12px 8px;text-align:center;font-size:0.7em;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border);white-space:nowrap;}
th.nc{text-align:left;padding-left:20px;min-width:180px;position:sticky;left:0;background:var(--surface2);z-index:10;border-right:1px solid var(--border);}
td{padding:10px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85em;}
td.ntd{text-align:left;padding-left:20px;font-weight:600;position:sticky;left:0;background:var(--surface);z-index:5;border-right:1px solid var(--border);}
tbody tr:hover td{background:rgba(255,255,255,0.03);}
tbody tr:hover td.ntd{background:rgba(255,255,255,0.05);}
.th-we{color:rgba(245,166,35,0.7)!important;}.td-we{background:rgba(245,166,35,0.04);}
.td-tod{background:rgba(0,212,170,0.08)!important;}.th-tod{color:var(--green)!important;}
input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--accent);}
.tc{background:rgba(233,69,96,0.08)!important;color:var(--accent);font-weight:700;font-size:1em!important;border-left:1px solid rgba(233,69,96,0.2)!important;}
.mb{background:transparent;border:1px solid var(--border);color:var(--text-dim);width:20px;height:20px;border-radius:4px;cursor:pointer;font-size:0.65em;display:inline-flex;align-items:center;justify-content:center;transition:all 0.2s;}
.mb:hover{border-color:var(--green);color:var(--green);}.mb:disabled{opacity:0.2;cursor:not-allowed;}
.nm{display:flex;align-items:center;gap:6px;}.mc{display:flex;flex-direction:column;gap:2px;}
.ra{display:flex;gap:4px;justify-content:center;}
.be,.bd{padding:4px 9px;border-radius:6px;cursor:pointer;font-size:0.75em;font-family:'Sora',sans-serif;font-weight:600;border:none;transition:all 0.2s;}
.be{background:rgba(245,166,35,0.2);color:var(--accent2);}.be:hover{background:rgba(245,166,35,0.35);}
.bd{background:rgba(233,69,96,0.15);color:var(--accent);}.bd:hover{background:rgba(233,69,96,0.3);}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
@media(max-width:900px){.sg{grid-template-columns:1fr;}}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.sh{padding:16px 20px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:700;font-size:0.85em;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);}
.st{width:100%;border-collapse:collapse;}
.st td{padding:10px 20px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85em;}
.st td:last-child{text-align:right;font-weight:700;color:var(--accent);}
.st .tr td{background:rgba(233,69,96,0.08);font-size:0.9em;border-bottom:none;}
.st .tr td:last-child{color:var(--green);font-size:1.1em;}
.fi{padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.85em;width:85px;}
.fi:focus{outline:none;border-color:var(--green);}
.fd{padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:0.75em;width:120px;}
.fd:focus{outline:none;border-color:var(--green);}
.bp{background:rgba(0,212,170,0.2);color:var(--green);padding:3px 9px;border-radius:100px;font-size:0.75em;font-weight:700;border:1px solid rgba(0,212,170,0.3);}
.bu{background:rgba(233,69,96,0.15);color:var(--accent);padding:3px 9px;border-radius:100px;font-size:0.75em;font-weight:700;border:1px solid rgba(233,69,96,0.3);}
.bpy{background:rgba(0,212,170,0.2);color:var(--green);border:none;padding:5px 10px;border-radius:6px;font-size:0.75em;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all 0.2s;}
.bpy:hover{background:rgba(0,212,170,0.35);}
.bpn{background:rgba(233,69,96,0.15);color:var(--accent);border:none;padding:5px 10px;border-radius:6px;font-size:0.75em;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:all 0.2s;}
.bpn:hover{background:rgba(233,69,96,0.3);}
.ftr td{background:rgba(0,212,170,0.08)!important;font-weight:700;}
@media(max-width:600px){
.topbar{padding:0 16px;}.app-body{padding:16px;}
.month-nav h2{font-size:1.2em;min-width:190px;}
.controls-bar{flex-direction:column;}.controls-bar input[type="text"]{min-width:100%;}}
</style>
</head>
<body>
<div id="loadingScreen"><div class="spinner"></div><div style="color:var(--text-dim);font-size:0.9em;">Зареждане...</div></div>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">📋</div>
      <h1>Клуб Присъствие</h1>
      <p>Управление на спортен клуб</p>
    </div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Вход</div>
      <div class="auth-tab" id="tabReg" onclick="switchTab('reg')">Регистрация</div>
    </div>
    <div id="loginForm">
